<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHP Words - Palabras reservadas de PHP</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="version-tag">
        <span class="version-prefix">v</span><span id="version"></span>
      </div>
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
    </header>

    <main class="app-main">
      <div id="controles"></div>

      <div class="status-bar">
        <p id="contador"></p>
      </div>

      <ul id="lista"></ul>
    </main>

    <footer class="app-footer">
      <p class="footer-note">Guía interactiva de referencia de palabras reservadas del lenguaje PHP.</p>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/palabras.js"></script>
  <script src="js/app.js"></script>
  <script src="js/buscador.js"></script>
  <script src="js/categorias.js"></script>
</body>

</html>
